name: Node.js CI Pipeline

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode dari repositori
        uses: actions/checkout@v4

      - name: Menyiapkan environment Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Instalasi dan Pengujian
        run: |
          echo "Menjalankan pipeline CI..."
          echo "Validasi environment Node.js berhasil!"
